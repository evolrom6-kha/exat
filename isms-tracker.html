<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISO 27001 ISMS Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#14213d;--muted:#5b6678;--line:#d5dbe3;--accent:#0f766e;--s0:#b42318;--s1:#b7791f;--s2:#0f766e;--na:#8892a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--surface:#182030;--ink:#e6ebf3;--muted:#98a3b8;--line:#2a3550;--accent:#3cc2b3;--s0:#f2766b;--s1:#e8b34f;--s2:#3cc2b3;--na:#7a859a}}
:root[data-theme="dark"]{--bg:#10151f;--surface:#182030;--ink:#e6ebf3;--muted:#98a3b8;--line:#2a3550;--accent:#3cc2b3;--s0:#f2766b;--s1:#e8b34f;--s2:#3cc2b3;--na:#7a859a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.big{font-size:44px;font-weight:700;line-height:1;min-width:110px;color:var(--accent)}
.big small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:6px}
.themes{flex:1;min-width:240px;display:grid;gap:8px}
.th{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tabs{display:flex;gap:4px;margin:22px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;color:var(--ink)}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.tools input{flex:1;min-width:160px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grp{margin:18px 0 6px;font-weight:700;font-size:14px;color:var(--muted)}
.row{display:grid;grid-template-columns:48px 1fr 150px;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--s0);border-radius:6px;padding:10px 12px;margin-bottom:6px}
.row.s1{border-left-color:var(--s1)}.row.s2{border-left-color:var(--s2)}.row.na{border-left-color:var(--na);opacity:.75}
.id{font-weight:700;color:var(--muted)}
.nm{font-weight:500}
.row select,.row .note{background:transparent;border:1px solid var(--line);border-radius:5px;padding:5px 8px;width:100%}
.row .note{grid-column:2 / 3}
.row label{grid-column:3;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.row .note{grid-row:2}.row label{grid-row:2}
.empty{color:var(--muted);padding:24px;text-align:center}
.toast{color:var(--muted);font-size:13px;align-self:center}
@media (max-width:620px){.row{grid-template-columns:40px 1fr}.row select,.row label,.row .note{grid-column:1 / -1;grid-row:auto}}
.tabs{flex-wrap:wrap}
.rr{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--na);border-radius:6px;padding:10px 12px;margin-bottom:6px}
.rr .f{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px;flex:1 1 120px}
.rr .f.w{flex:3 1 240px}
.rr input,.rr select{background:transparent;border:1px solid var(--line);border-radius:5px;padding:5px 8px;width:100%}
.badge{font-weight:700;min-width:84px;text-align:center;border-radius:5px;padding:6px 8px;color:#fff}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0 0 14px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
.steps li::before{content:counter(s) ". ";font-weight:700;color:var(--accent)}
.frm{display:flex;flex-wrap:wrap;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.frm h2{flex:1 1 100%;margin:0;font-size:20px}
.frm .f{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px;flex:1 1 180px}
.frm .f.w{flex:1 1 100%}
.frm input,.frm select,.frm textarea{background:transparent;border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;font:inherit;color:var(--ink)}
.frm .acts{flex:1 1 100%;display:flex;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media print{body{background:#fff;color:#000}.tabs,.tools,#hero,.acts,.sub,.steps{display:none!important}.frm{border:0;padding:0}.frm input,.frm select,.frm textarea{color:#000}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:30px;line-height:1.15;color:var(--ink)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.dc h3{margin:0 0 10px;font-size:15px}
.dc h4{margin:12px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dc .th{grid-template-columns:104px 1fr 32px;margin-bottom:6px}
.dc p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.tr{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.tr .badge{min-width:70px;padding:3px 6px;font-size:12px}
.sm{display:flex;flex-wrap:wrap;gap:8px}
.sm button{flex:1 1 140px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:13px}
.sm button:hover{border-color:var(--accent)}.sm b{display:block;font-size:14px}
@media print{.dc,.kpi{break-inside:avoid}}
.tlw{overflow-x:auto;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tl{display:grid;grid-template-columns:140px repeat(12,minmax(72px,1fr));min-width:1000px}
.tl>div{padding:6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:12px;min-height:44px}
.tlh{font-weight:700;color:var(--muted)}
.tlc.now,.tlh.now{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip{display:block;color:#fff;border-radius:4px;padding:2px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.chip.done{opacity:.55}.chip.off{opacity:.35;text-decoration:line-through}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.lg .chip{margin:0;padding:3px 8px}
.row small.tha{display:block;color:var(--muted);font-weight:400;font-size:12px}
.det{grid-column:1 / -1;font-size:13px}
.det summary{cursor:pointer;color:var(--muted)}
.det label{flex-direction:column;align-items:stretch;gap:2px;margin-top:8px;color:var(--muted)}
.det textarea{background:transparent;border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;font:inherit;color:var(--ink)}
.dd{flex:1 1 100%;font-size:13px}
.dd summary{cursor:pointer;color:var(--muted);margin-top:4px}
.dg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fh{flex:1 1 100%;margin:10px 0 0;font-size:14px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
.pf{background:#fff;color:#000;border:1px solid var(--line);max-width:794px;margin:0 auto;padding:16px;font:13px/1.45 "Sarabun","Noto Sans Thai",Tahoma,sans-serif}
.pf .pg{margin-bottom:24px}
.pf table{width:100%;border-collapse:collapse}
.pf td{border:1px solid #000;padding:4px 6px;vertical-align:top}
.pf .bh{background:#b7dde8;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pf .tall{height:70px}.pf .sg{height:90px;text-align:center}
.pf table table td{border:0;padding:1px 4px}
.pf .ctr{text-align:center;font-weight:700;margin-bottom:4px}
@page{size:A4;margin:12mm}
@media print{h1{display:none}.pf{border:0;padding:0;max-width:none}.pf .pg{margin:0}.pf .pg1{page-break-after:always}}
.eft{border-collapse:collapse;width:100%;font-size:13px}
.eft th,.eft td{border:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap}
.eft th:first-child,.eft td:first-child{text-align:left}
.eft th{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.wrapx{overflow-x:auto}
.ok{color:var(--s2);font-weight:700}.bad{color:var(--s0);font-weight:700}.nd{color:var(--muted)}
.tools label.toast input{flex:none;width:90px;margin-left:4px}
.flow{width:100%;height:auto}
.fn rect{fill:var(--surface);stroke:var(--line)}.fn.on rect{stroke:var(--accent);stroke-width:2}
.fb{font-size:20px;font-weight:700;fill:var(--ink)}.fl{font-size:12px;fill:var(--muted)}
.fa{stroke:var(--muted);stroke-width:1.5}.dsh{stroke-dasharray:5 4}.ft{font-size:12px;fill:var(--ink)}.lane{font-size:13px;font-weight:700;fill:var(--accent)}
.eft.mp th,.eft.mp td{text-align:left;white-space:normal;vertical-align:top}
.mp td div{margin-bottom:6px}
.rr textarea{background:transparent;border:1px solid var(--line);border-radius:5px;padding:5px 8px;width:100%;font:inherit;color:var(--ink)}
.wide .th{grid-template-columns:210px 1fr 32px}
</style>
</head>
<body>
<main>
<h1>ISO 27001 ISMS tracker</h1>
<p class="sub">Track Annex A controls (2022 edition) and management clauses 4–10. <strong id="dbs">Saved in this browser only</strong></p>

<section class="hero" id="hero" aria-label="Overall readiness">
  <div class="big"><span id="pct">0%</span><small id="cnt"></small></div>
  <div class="themes" id="themes"></div>
</section>

<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="D">Dashboard</button>
  <button role="tab" aria-selected="false" data-tab="E">Effectiveness</button>
  <button role="tab" aria-selected="false" data-tab="A">Annex A controls (SoA)</button>
  <button role="tab" aria-selected="false" data-tab="C">Clauses 4–10</button>
  <button role="tab" aria-selected="false" data-tab="R">Risk register</button>
  <button role="tab" aria-selected="false" data-tab="Z">Assets</button>
  <button role="tab" aria-selected="false" data-tab="H">Change management</button>
  <button role="tab" aria-selected="false" data-tab="I">Incidents</button>
  <button role="tab" aria-selected="false" data-tab="S">Schedule</button>
  <button role="tab" aria-selected="false" data-tab="X">Access</button>
</div>

<div class="tools" id="tools">
  <input id="q" type="search" placeholder="Search by number or name" aria-label="Search">
  <select id="fs" aria-label="Filter by status">
    <option value="">All statuses</option><option value="0">Not started</option><option value="1">In progress</option><option value="2">Implemented</option><option value="x">Not applicable</option>
  </select>
  <button class="btn" id="copy">Copy as table</button>
  <button class="btn" id="reset">Reset</button>
  <span class="toast" id="toast" role="status"></span>
</div>
<div id="list"></div>
</main>

<script>
const ANNEX=[
["Organizational","5","Policies for information security|Information security roles and responsibilities|Segregation of duties|Management responsibilities|Contact with authorities|Contact with special interest groups|Threat intelligence|Information security in project management|Inventory of information and other associated assets|Acceptable use of information and other associated assets|Return of assets|Classification of information|Labelling of information|Information transfer|Access control|Identity management|Authentication information|Access rights|Information security in supplier relationships|Addressing information security within supplier agreements|Managing information security in the ICT supply chain|Monitoring, review and change management of supplier services|Information security for use of cloud services|Incident management planning and preparation|Assessment and decision on information security events|Response to information security incidents|Learning from information security incidents|Collection of evidence|Information security during disruption|ICT readiness for business continuity|Legal, statutory, regulatory and contractual requirements|Intellectual property rights|Protection of records|Privacy and protection of PII|Independent review of information security|Compliance with policies, rules and standards|Documented operating procedures"],
["People","6","Screening|Terms and conditions of employment|Awareness, education and training|Disciplinary process|Responsibilities after termination or change of employment|Confidentiality or non-disclosure agreements|Remote working|Information security event reporting"],
["Physical","7","Physical security perimeters|Physical entry|Securing offices, rooms and facilities|Physical security monitoring|Protecting against physical and environmental threats|Working in secure areas|Clear desk and clear screen|Equipment siting and protection|Security of assets off-premises|Storage media|Supporting utilities|Cabling security|Equipment maintenance|Secure disposal or re-use of equipment"],
["Technological","8","User endpoint devices|Privileged access rights|Information access restriction|Access to source code|Secure authentication|Capacity management|Protection against malware|Management of technical vulnerabilities|Configuration management|Information deletion|Data masking|Data leakage prevention|Information backup|Redundancy of information processing facilities|Logging|Monitoring activities|Clock synchronization|Use of privileged utility programs|Installation of software on operational systems|Networks security|Security of network services|Segregation of networks|Web filtering|Use of cryptography|Secure development life cycle|Application security requirements|Secure system architecture and engineering principles|Secure coding|Security testing in development and acceptance|Outsourced development|Separation of development, test and production environments|Change management|Test information|Protection of information systems during audit testing"]];
const CLAUSES=[
["4 Context","4","Understand the organization and its context|Needs and expectations of interested parties|Determine the scope of the ISMS|Establish and maintain the ISMS"],
["5 Leadership","5","Leadership and commitment|Information security policy|Organizational roles, responsibilities and authorities"],
["6 Planning","6","Risk assessment and treatment process, SoA|Information security objectives|Planning of changes"],
["7 Support","7","Resources|Competence|Awareness|Communication|Documented information"],
["8 Operation","8","Operational planning and control|Perform risk assessments|Implement risk treatment plan"],
["9 Performance evaluation","9","Monitoring, measurement, analysis and evaluation|Internal audit|Management review"],
["10 Improvement","10","Continual improvement|Nonconformity and corrective action"]];
function build(src,pre){const o=[];src.forEach(([g,n,l])=>l.split("|").forEach((t,i)=>o.push({id:pre+n+"."+(i+1),g,t})));return o}
const DATA={A:build(ANNEX,""),C:build(CLAUSES,"")};
const ST=["Not started","In progress","Implemented"];
let tab="D",KEY="iso27001-tracker-v1",S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
const $=id=>document.getElementById(id);
const key=(t,id)=>t+"_"+id.replace(/\./g,"_");
const get=(t,id)=>S[key(t,id)]||{a:1,s:0,n:""};
let REF=null,last={},dirty=false,inflight=false,tmr=0;
const busy=()=>dirty||inflight;
function setStatus(m){const e=$("dbs");if(e)e.textContent=m}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!REF)return;
  dirty=true;clearTimeout(tmr);setStatus("Saving...");tmr=setTimeout(flush,600);
}
async function flush(){
  if(!REF){dirty=false;return}
  const nowJ={};Object.keys(S).forEach(k=>nowJ[k]=cj(S[k]));
  const ch={};Object.keys(nowJ).forEach(k=>{if(last[k]!==nowJ[k])ch[k]=JSON.parse(nowJ[k])});
  const removed=Object.keys(last).some(k=>!(k in nowJ));
  dirty=false;inflight=true;
  try{
    if(removed)await REF.set(JSON.parse(JSON.stringify(S)));
    else if(Object.keys(ch).length)await REF.update(ch);
    last=nowJ;setStatus("Saved to shared database");
  }catch(e){setStatus(e&&e.code==="invalid_argument"?"View only: you do not have permission to edit":"Could not reach the database. Changes are kept in this browser.")}
  inflight=false;
}
let late=false;
function applyRemote(d){
  const n=JSON.parse(JSON.stringify(d||{}));
  const same=Object.keys(n).length===Object.keys(S).length&&Object.keys(n).every(k=>cj(n[k])===cj(S[k]));
  last={};Object.keys(n).forEach(k=>last[k]=cj(n[k]));
  if(same)return;
  S=n;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  const a=document.activeElement;
  if(a&&$("list").contains(a)&&/INPUT|SELECT/.test(a.tagName))late=true;else render();
}
document.addEventListener("focusout",()=>{if(late)setTimeout(()=>{if(!$("list").contains(document.activeElement)){late=false;render()}},0)});
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function summary(){
  let all=0,done=0;
  const groups={};
  DATA[tab].forEach(c=>{const v=get(tab,c.id),g=groups[c.g]||(groups[c.g]={n:0,d:0,p:0});
    if(!v.a)return;g.n++;all++;if(v.s==2){g.d++;done++}else if(v.s==1)g.p++});
  $("pct").textContent=(all?Math.round(done/all*100):0)+"%";
  $("cnt").textContent=done+" of "+all+" applicable "+(tab=="A"?"controls":"requirements")+" implemented";
  $("themes").innerHTML=Object.entries(groups).map(([g,v])=>{
    const d=v.n?v.d/v.n*100:0,p=v.n?v.p/v.n*100:0;
    return `<div class="th"><span>${esc(g)}</span><div class="bar" role="img" aria-label="${v.d} of ${v.n} implemented"><i style="width:${d}%;background:var(--s2)"></i><i style="width:${p}%;background:var(--s1)"></i></div><span>${v.d}/${v.n}</span></div>`}).join("");
}
const RS=['Baseline control','Risk treatment','Baseline + risk treatment','Excluded'];
function det(v,id){
  const x=(f,l)=>`<label>${l}<textarea data-x="${f}" rows="2">${esc(v[f]||'')}</textarea></label>`;
  return `<details class="det"${OPN.has('A'+id)?' open':''} data-o="A${id}"><summary>Reason and current controls${v.rs?': '+esc(v.rs):''}</summary><label>Reason for selection<select data-x="rs"><option value="">Not set</option>${RS.map(o=>`<option${v.rs===o?' selected':''}>${o}</option>`).join('')}</select></label>${x('bo','Current control: Back Office')}${x('fo','Current control: Front Office')}</details>`;
}
function render(){
  const reg="RZHIDSEX".includes(tab);$("hero").hidden=reg;$("tools").hidden=reg;if(reg)return renderReg();
  const q=$("q").value.trim().toLowerCase(),f=$("fs").value;let last="",h="";
  DATA[tab].forEach(c=>{
    const v=get(tab,c.id);
    if(q&&!(c.id+" "+c.t).toLowerCase().includes(q))return;
    if(f==="x"?v.a:(f!==""&&(!v.a||v.s!=f)))return;
    if(c.g!==last){h+=`<div class="grp">${esc(c.g)}</div>`;last=c.g}
    const cls=!v.a?"na":"s"+v.s;
    h+=`<div class="row ${cls}" data-id="${c.id}"><span class="id">${c.id}</span><span class="nm">${esc(c.t)}${v.th?`<small class="tha">${esc(v.th)}</small>`:""}</span>
    <select aria-label="Status for ${c.id}" ${v.a?"":"disabled"}>${ST.map((s,i)=>`<option value="${i}" ${v.s==i?"selected":""}>${s}</option>`).join("")}</select>
    <input class="note" placeholder="${v.a?"Owner, evidence or link":"Justification for exclusion"}" value="${esc(v.n)}" aria-label="Notes for ${c.id}">
    <label><input type="checkbox" ${v.a?"checked":""}> Applicable</label>${tab==="A"?det(v,c.id):""}</div>`;
  });
  $("list").innerHTML=h||'<div class="empty">No matches. Clear the search or change the status filter.</div>';
  summary();
}
function upd(row,fn){
  const id=row.dataset.id,v=Object.assign({},get(tab,id));fn(v);S[key(tab,id)]=v;save();return v;
}
$("list").addEventListener("change",e=>{
  const row=e.target.closest(".row");if(!row)return;
  if(e.target.type==="checkbox")upd(row,v=>v.a=e.target.checked?1:0);
  else if(e.target.tagName==="TEXTAREA")return;
  else if(e.target.dataset.x)upd(row,v=>v[e.target.dataset.x]=e.target.value);
  else if(e.target.tagName==="SELECT")upd(row,v=>v.s=+e.target.value);
  else return;
  render();
});
$("list").addEventListener("input",e=>{
  if(e.target.classList.contains("note")){const row=e.target.closest(".row");upd(row,v=>v.n=e.target.value)}
  else if(e.target.dataset.x&&e.target.tagName==="TEXTAREA"){const row=e.target.closest(".row");upd(row,v=>v[e.target.dataset.x]=e.target.value)}
});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));render();
});
$("q").oninput=render;$("fs").onchange=render;
function toast(m){$("toast").textContent=m;setTimeout(()=>$("toast").textContent="",3000)}
$("copy").onclick=async()=>{
  const t=["ID\tName\tApplicable\tStatus\tNotes\tReason\tBack Office\tFront Office"].concat(DATA[tab].map(c=>{const v=get(tab,c.id);
    return [c.id,c.t,v.a?"Yes":"No",v.a?ST[v.s]:"n/a",v.n.replace(/\s+/g," "),v.rs||"",(v.bo||"").replace(/\s+/g," "),(v.fo||"").replace(/\s+/g," ")].join("\t")})).join("\n");

  const rows=F.sites.map(x=>{const o=A[x.s]||{},e=last(x.s),mt=pv(o.t||0,o.e||0),av=pv((o.q||0)-(o.d||0),o.q||0),df=e===null?null:x.n-e;tn+=x.n;if(x.n0&&x.n0!==x.n)adj.push(x.s+': the facility file listed '+x.n0+' items; '+x.n+' is confirmed correct, as in the monthly records');if(e!==null)te+=e;if(df)diffs.push(x.s+' lists '+x.n+' items but the monthly records count '+e);

function cj(v){return JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,y)=>(o[y]=x[y],o),{}):x)}
function makeRef(db){
  const BIG={assets:'isms_assets',risks:'isms_risks'},CH=50,main=db.doc('isms/state'),wc={assets:{},risks:{}},hv={assets:0,risks:0};
  const nm=i=>'c'+String(i).padStart(3,'0');
  async function wbig(k,rows){
    const col=db.collection(BIG[k]),w=wc[k],n=Math.ceil(rows.length/CH),ps=[];
    for(let i=0;i<n;i++){const part=rows.slice(i*CH,(i+1)*CH),j=cj(part),id=nm(i);if(w[id]!==j)ps.push(col.doc(id).set({rows:part}).then(()=>{w[id]=j}))}
    for(let i=n;i<hv[k];i++)ps.push(col.doc(nm(i)).delete().then(()=>{delete w[nm(i)]}));
    await Promise.all(ps);hv[k]=n;
  }
  return{
    async update(ch){const m={};for(const k of Object.keys(ch)){if(BIG[k])await wbig(k,ch[k]||[]);else m[k]=ch[k]}if(Object.keys(m).length)await main.update(m)},
    async set(all){const m={};Object.keys(all).forEach(k=>{if(!BIG[k])m[k]=all[k]});await main.set(m);for(const k of Object.keys(BIG))await wbig(k,all[k]||[])},
    onSnapshot(cb,err){
      const P={};
      const fire=()=>{
        if(!P.main||!P.assets||!P.risks)return;
        const d=Object.assign({},P.main.exists?P.main.data():{});
        Object.keys(BIG).forEach(k=>{if(P[k].length)d[k]=P[k]});
        cb({exists:P.main.exists||P.assets.length>0||P.risks.length>0,data:()=>d});
      };
      main.onSnapshot(s=>{P.main=s;fire()},err);
      Object.keys(BIG).forEach(k=>db.collection(BIG[k]).onSnapshot(s=>{
        const ds=s.docs.slice().sort((a,b)=>a.id<b.id?-1:1);
        wc[k]={};hv[k]=ds.length;P[k]=[];
        ds.forEach(x=>{const rows=(x.data()||{}).rows||[];wc[k][x.id]=cj(rows);P[k]=P[k].concat(rows)});
        fire();
      },err));
    }
  };
}

})();
